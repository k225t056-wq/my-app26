<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Profile Card Generator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <i class="fa-solid fa-gamepad"></i>
                <h1>GAME CARD GEN</h1>
            </div>
            <div class="header-status">
                <span class="badge">GitHub Pages Ready</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="editor-panel">
            <div class="card-section">
                <h2><i class="fa-solid fa-user-gear"></i> 基本情報</h2>
                <div class="input-group">
                    <label for="input-name">プレイヤー名</label>
                    <input type="text" id="input-name" placeholder="Gamer Name" value="Gamer_Alpha">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="input-game">メインゲーム</label>
                        <input type="text" id="input-game" placeholder="Game Title" value="Apex Legends">
                    </div>
                    <div class="input-group">
                        <label for="input-history">プレイ歴</label>
                        <input type="text" id="input-history" placeholder="例: 3年" value="約3年">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="input-platform">プラットフォーム</label>
                        <select id="input-platform">
                            <option value="PC">PC</option>
                            <option value="PlayStation">PlayStation</option>
                            <option value="Nintendo Switch">Nintendo Switch</option>
                            <option value="Xbox">Xbox</option>
                            <option value="Mobile">Mobile</option>
                            <option value="マルチ" selected>マルチ</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="input-time">活動時間帯</label>
                        <input type="text" id="input-time" placeholder="例: 21:00〜" value="21:00 〜 24:00">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="input-style">プレイスタイル</label>
                        <select id="input-style">
                            <option value="エンジョイ勢" selected>エンジョイ勢</option>
                            <option value="ガチ勢">ガチ勢</option>
                            <option value="のんびり">のんびり</option>
                            <option value="ワイワイ">ワイワイ</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="input-vc">VC可否</label>
                        <select id="input-vc">
                            <option value="可" selected>可</option>
                            <option value="聞き専">聞き専</option>
                            <option value="不可">不可</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label for="input-vc-method">VC方法</label>
                    <select id="input-vc-method">
                        <option value="Discord" selected>Discord</option>
                        <option value="LINE">LINE</option>
                        <option value="ゲーム内">ゲーム内</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="input-bio">自己紹介</label>
                    <textarea id="input-bio" rows="3">よろしくお願いします！楽しく遊びましょう！</textarea>
                </div>
            </div>

            <div class="card-section">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> ビジュアル</h2>
                <div class="input-group">
                    <label>テーマカラー</label>
                    <div class="color-picker">
                        <button class="color-btn active" data-color="#9333ea" style="background-color: #9333ea;"></button>
                        <button class="color-btn" data-color="#db2777" style="background-color: #db2777;"></button>
                        <button class="color-btn" data-color="#06b6d4" style="background-color: #06b6d4;"></button>
                        <button class="color-btn" data-color="#10b981" style="background-color: #10b981;"></button>
                        <button class="color-btn" data-color="#f59e0b" style="background-color: #f59e0b;"></button>
                        <button class="color-btn" data-color="#dc2626" style="background-color: #dc2626;"></button>
                    </div>
                </div>
                <div class="image-upload-row">
                    <div class="upload-group">
                        <label>アバター</label>
                        <label class="upload-box" for="upload-avatar">
                            <i class="fa-solid fa-upload"></i>
                            <span>アップロード</span>
                            <input type="file" id="upload-avatar" accept="image/*" hidden>
                        </label>
                    </div>
                    <div class="upload-group">
                        <label>背景</label>
                        <label class="upload-box" for="upload-bg">
                            <i class="fa-solid fa-image"></i>
                            <span>アップロード</span>
                            <input type="file" id="upload-bg" accept="image/*" hidden>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <section class="preview-panel">
            <div class="preview-container">
                <div class="preview-header">
                    <span><i class="fa-solid fa-circle"></i> LIVE PREVIEW</span>
                    <small>1920 x 1080 Output</small>
                </div>
                <div class="preview-canvas-wrapper">
                    <!-- The actual high-res canvas is hidden, we show its data in an img for responsiveness -->
                    <img id="preview-image" alt="Preview Result">
                </div>
            </div>

            <div class="actions">
                <button id="btn-download" class="btn-primary">
                    <i class="fa-solid fa-download"></i> カードをダウンロード
                </button>
                <button id="btn-copy" class="btn-secondary">
                    <i class="fa-solid fa-copy"></i> 画像をコピー
                </button>
            </div>
        </section>
    </main>

    <footer class="container">
        <p>&copy; 2026 Game Profile Card Generator</p>
    </footer >

    <canvas id="render-canvas" width="1920" height="1080" style="display: none;"></canvas>

    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-check-circle"></i>
        <span id="toast-message">メッセージ</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
